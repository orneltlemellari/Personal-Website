<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <meta
      name="description"
      content="Get in touch with Ornelt Lemellari for entry-level Software Engineer, IT Support, or Trainee opportunities."
    />
    <meta property="og:title" content="Contact • Ornelt Lemellari" />
    <meta
      property="og:description"
      content="Get in touch with Ornelt Lemellari for entry-level Software Engineer, IT Support, or Trainee opportunities (remote / US time zones)."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://orneltlemellari.github.io/Personal-Website/pages/contact.html" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Contact • Ornelt Lemellari" />
    <meta
      name="twitter:description"
      content="Get in touch with Ornelt Lemellari for entry-level Software Engineer, IT Support, or Trainee opportunities (remote / US time zones)."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
    <script defer src="../script.js"></script>
  </head>
  <body data-page="contact">
    <a class="skip-link" href="#main">Skip to content</a>
    <header data-site-header></header>
    
    <main id="main" class="container">
      <section class="section">
        <div class="section-head">
          <p class="section-label">Contact</p>
          <h2 class="h2">Say hello</h2>
        </div>
        <div class="contact-grid">
          <article class="card">
            <div class="card-scanner"></div>
            <div class="info-list">
              <div class="info-block">
                <h3>Email</h3>
                <p>
                  <a href="mailto:orneltlemellari@gmail.com"
                    >orneltlemellari@gmail.com</a
                  >
                </p>
              </div>
              <div class="info-block">
                <h3>GitHub</h3>
                <p>
                  <a
                    href="https://github.com/orneltlemellari"
                    target="_blank"
                    rel="noopener noreferrer"
                    >github.com/orneltlemellari</a
                  >
                </p>
              </div>
              <div class="info-block">
                <h3>LinkedIn</h3>
                <p>
                  <a
                    href="https://linkedin.com/in/orneltlemellari"
                    target="_blank"
                    rel="noopener noreferrer"
                    >linkedin.com/in/orneltlemellari</a
                  >
                </p>
              </div>
              <div class="project-links">
                <a class="btn btn-primary" href="mailto:orneltlemellari@gmail.com"
                  >Email</a
                >
                <a
                  class="btn btn-secondary"
                  href="https://github.com/orneltlemellari"
                  target="_blank"
                  rel="noopener noreferrer"
                  >GitHub</a
                >
                <a
                  class="btn btn-secondary"
                  href="https://linkedin.com/in/orneltlemellari"
                  target="_blank"
                  rel="noopener noreferrer"
                  >LinkedIn</a
                >
              </div>
            </div>
          </article>
          
          <form class="card form" id="contact-form">
            <div class="card-scanner"></div>
            <label>
              <span>Name</span>
              <input
                name="name"
                autocomplete="name"
                required
                placeholder="Your name"
              />
            </label>
            <label>
              <span>Email</span>
              <input
                name="email"
                type="email"
                autocomplete="email"
                required
                placeholder="your@email.com"
              />
            </label>
            <label>
              <span>Message</span>
              <textarea
                name="message"
                rows="6"
                required
                placeholder="Write your message"
              ></textarea>
            </label>
            <button class="btn btn-primary" type="submit">Send</button>
          </form>
        </div>
      </section>
    </main>
    
    <footer data-site-footer></footer>
  </body>
</html>
